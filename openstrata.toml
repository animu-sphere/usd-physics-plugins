[project]
name = "usd-physics-plugins"
version = "0.1.0"

[requires]
platform = "cy2026"
profile = "usd"

[build.intents.jolt]
cache = {
  PHYSICSJOLT_REQUIRE_JOLT = { type = "BOOL", value = true }
}

[workspace]
members = [
  "libs/physicsCore",
  "backends/physicsJolt",
]
release_members = [
  "physicsCore",
  "physicsJolt",
]
